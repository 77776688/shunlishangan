<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0d1014;--bg2:#12171e;--card:#171d25;--card2:#1d2530;--line:#242e3a;
--gold:#e5c07b;--gold2:#f7e3b5;--red:#d0534a;--jade:#5cb89a;--blue:#6aa9e0;--purple:#a98bd8;
--txt:#e8eaed;--sub:#8d97a5;--dim:#5a6470;
}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;font-size:14px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
#pages{padding:0 14px calc(78px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font-family:inherit;font-size:14px}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 2px}
.sec-title h3{font-size:15px;font-weight:600;letter-spacing:.5px}
.sec-title .more{font-size:12px;color:var(--sub)}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.wrap{flex-wrap:wrap}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.sub{color:var(--sub);font-size:12px}.dim{color:var(--dim);font-size:11px}
.gold{color:var(--gold)}.red{color:var(--red)}.jade{color:var(--jade)}.blue{color:var(--blue)}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:500;transition:.15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#e5c07b,#c9a05a);color:#231a08;border:none;font-weight:700;box-shadow:0 4px 16px rgba(229,192,123,.22)}
.btn-red{background:linear-gradient(135deg,#d0534a,#a83c35);color:#fff;border:none;font-weight:600}
.btn-jade{background:linear-gradient(135deg,#5cb89a,#3f8e75);color:#06231a;border:none;font-weight:700}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.chip{padding:7px 12px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.chip.on{background:rgba(229,192,123,.14);border-color:var(--gold);color:var(--gold);font-weight:600}
.bar{height:8px;border-radius:6px;background:#0c1015;overflow:hidden;border:1px solid #1d242d}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#c9a05a,#f7e3b5);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;background:var(--bg2);border:1px solid var(--line);color:var(--sub)}
.divider{height:1px;background:var(--line);margin:12px 0}

/* ---------- 顶部 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 82%,rgba(13,16,20,0));padding:calc(10px + env(safe-area-inset-top)) 14px 8px;max-width:560px;margin:0 auto}
.cdbar{display:flex;gap:8px}
.cdbox{flex:1;background:linear-gradient(135deg,#1b1620,#171d25);border:1px solid var(--line);border-radius:11px;padding:8px 10px;position:relative;overflow:hidden}
.cdbox::after{content:"";position:absolute;right:-14px;top:-14px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(229,192,123,.14),transparent 70%)}
.cdbox .n{font-size:19px;font-weight:800;letter-spacing:-.5px}
.cdbox .l{font-size:10.5px;color:var(--sub)}

/* ---------- 角色卡 ---------- */
.hero{background:linear-gradient(150deg,#241d16 0%,#171d25 55%);border:1px solid #3a2f22;border-radius:16px;padding:16px;margin-top:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(229,192,123,.13),transparent 70%)}
.avatar{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f7e3b5,#c9a05a 60%,#8a6a33);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#2b200a;border:2px solid rgba(247,227,181,.5);box-shadow:0 0 22px rgba(229,192,123,.28);flex:none}
.lvtag{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(229,192,123,.16);border:1px solid rgba(229,192,123,.4);color:var(--gold);font-weight:700}
.stat3{display:flex;gap:6px;margin-top:12px}
.stat3>div{flex:1;background:rgba(0,0,0,.26);border-radius:10px;padding:7px 4px;text-align:center}
.stat3 .v{font-size:15px;font-weight:800;line-height:1.2}
.stat3 .k{font-size:10px;color:var(--sub);margin-top:1px}

/* ---------- 六维 ---------- */
.attrrow{display:flex;align-items:center;gap:8px;margin-top:9px}
.attrrow .nm{width:52px;font-size:12px;color:var(--sub);flex:none}
.attrrow .bar{flex:1}
.attrrow .vv{width:34px;text-align:right;font-size:12px;font-weight:700;flex:none}

/* ---------- 环形进度 ---------- */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:88px;height:88px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .inner b{font-size:19px;line-height:1}
.ring .inner span{font-size:9.5px;color:var(--sub)}

/* ---------- 底部导航 ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(15,19,25,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
#tabbar button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--dim);transition:.2s;letter-spacing:-.3px}
#tabbar button .ic{font-size:18px;filter:grayscale(1);opacity:.5;transition:.2s}
#tabbar button.on{color:var(--gold)}
#tabbar button.on .ic{filter:none;opacity:1;transform:translateY(-1px)}
#tabbar button .dot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--red)}

/* ---------- 弹层 ---------- */
#overlay{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
#overlay .mask{position:absolute;inset:0;background:rgba(0,0,0,.68);animation:fade .25s}
@keyframes fade{from{opacity:0}}
#overlay .sheet{position:relative;width:100%;max-width:560px;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .32s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{font-size:17px;margin-bottom:4px}
.sh-close{position:absolute;right:14px;top:14px;font-size:20px;color:var(--dim);line-height:1}

/* ---------- 计时器 ---------- */
.timer{width:210px;height:210px;margin:6px auto 0;position:relative}
.timer svg{transform:rotate(-90deg)}
.timer .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.timer .t{font-size:40px;font-weight:200;letter-spacing:1px;font-variant-numeric:tabular-nums}
.timer .st{font-size:12px;color:var(--sub)}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
.flowglow{box-shadow:0 0 60px rgba(108,184,154,.35);border-radius:50%}

/* ---------- 飘字 ---------- */
#fly{position:fixed;inset:0;z-index:90;pointer-events:none}
.flytxt{position:absolute;left:50%;font-size:17px;font-weight:800;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);animation:fly 1.5s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
@keyframes fly{0%{transform:translate(-50%,0) scale(.6);opacity:0}18%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-96px) scale(1);opacity:0}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%;max-width:420px}
.toast{background:rgba(30,37,47,.97);border:1px solid var(--line);border-radius:12px;padding:10px 15px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .3s;max-width:100%}
@keyframes tin{from{transform:translateY(16px);opacity:0}}

/* ---------- 宝箱 ---------- */
.boxpick{width:150px;height:150px;margin:10px auto 0;display:flex;align-items:center;justify-content:center;font-size:66px;animation:shake 1.1s infinite;filter:drop-shadow(0 0 26px rgba(229,192,123,.5))}
@keyframes shake{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

 {id:'a22',n:'博闻强识',d:'累计记录200条速记',i:'📚',f:s=>s.poli.items.length>=200}
];
const MAINS=[
 {id:'m1',n:'小试牛刀',d:'累计闭关600分钟',xp:300,coin:100,f:s=>s.total.min>=600},
 {id:'m2',n:'题海初渡',d:'累计刷题1000道',xp:500,coin:150,f:s=>s.total.q>=1000},
 {id:'m3',n:'行测通玄',d:'行测五科修为均达200',xp:800,coin:300,f:s=>SUBS.slice(0,5).every(x=>s.attr[x.k]>=200)},
 {id:'m4',n:'笔走龙蛇',d:'申论修为达300',xp:600,coin:200,f:s=>s.attr['申论']>=300},
 {id:'m5',n:'习惯成自然',d:'连续学习21天',xp:1000,coin:400,f:s=>s.bestStreak>=21}
];
const DAILY_POOL=[
 {n:'闭关修炼45分钟',u:'min',t:45,xp:45,coin:25},
 {n:'闭关修炼90分钟',u:'min',t:90,xp:90,coin:50},
 {n:'闭关修炼150分钟',u:'min',t:150,xp:160,coin:90},
 {n:'演武刷题30道',u:'q',t:30,xp:40,coin:20},
 {n:'演武刷题60道',u:'q',t:60,xp:85,coin:45},
 {n:'申论成文一篇',u:'essay',t:1,xp:120,coin:60},
 {n:'时政速记打卡1次',u:'poli',t:1,xp:45,coin:25},
 {n:'常识时政速记20分钟',u:'min',t:20,xp:30,coin:15},
 {n:'开启一次机缘宝箱',u:'box',t:1,xp:25,coin:0},
 {n:'错题复盘15分钟',u:'min',t:15,xp:35,coin:18}
];
const FRIENDS=['青云直上','墨染长安','三省吾身','破釜沉舟','图书馆常客','早八战士','申论小王子','行测狂魔','锦鲤本鲤','南山有台','一苇渡江','不破楼兰','静水流深','挑灯夜读','上岸吧少年','公考老阿姨','卷王本王','佛系但上岸'];
/* 时政速记分类 */
const POLI_CATS=[
 {k:'时政要闻',i:'📰',c:'#d0534a'},
 {k:'创新理论',i:'🚩',c:'#e5c07b'},
 {k:'法律法规',i:'⚖️',c:'#6aa9e0'},
 {k:'山东时政',i:'🗺️',c:'#5cb89a'},
 {k:'科技人文',i:'🔭',c:'#a98bd8'},
 {k:'经济常识',i:'📈',c:'#e08a6a'}
];
/* 艾宾浩斯间隔重复：第 n 次复习后的间隔天数 */
const REVIEW_GAP=[1,2,4,7,15,30,60];

/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const pad=n=>(n<10?'0':'')+n;
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const dayGap=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const rnd=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
function rankOf(lv){let r=RANKS[0];RANKS.forEach(x=>{if(lv>=x.lv)r=x});return r.t}
function xpNeed(lv){return Math.floor(100+(lv-1)*62+Math.pow(lv-1,1.72)*3)}
function mmss(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function buzz(ms){if(S&&S.cfg.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

/* ============ 状态 ============ */
function freshToday(){return{min:0,q:0,essay:0,box:0,evt:0,poli:0}}
function defState(){
 const t=today();
 return {
  name:'赶考人',lv:1,xp:0,coin:0,key:0,streak:0,bestStreak:0,streakDate:null,
  attr:{言语:0,判断:0,资料:0,数量:0,常识:0,申论:0},
  today:freshToday(),lastDay:t,history:{},
  total:{min:0,q:0,box:0,focus:0},
  poli:{streak:0,best:0,last:null,total:0,reviews:0,items:[]},
  boss:{cleared:{},fights:0,bestDmg:0,cur:null},
  quests:[],main:{},achs:{},cards:[],bag:[],
  oath:{min:60,signed:false,streak:0},bestOath:0,debuff:null,
  cfg:{gk:'2026-11-29',sk:'2026-12-13',goal:90,vib:true},
  buff:{wchangUntil:0,danwu:0},
  timer:null,flags:{},log:[]
 };
}
function load(){
 try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);const d=defState();for(const k in d)if(S[k]===undefined)S[k]=d[k];for(const k in d.cfg)if(S.cfg[k]===undefined)S.cfg[k]=d.cfg[k];for(const k in d.attr)if(S.attr[k]===undefined)S.attr[k]=0;for(const k in d.total)if(S.total[k]===undefined)S.total[k]=0;
 if(!S.poli)S.poli=defState().poli;else{const p=defState().poli;for(const k in p)if(S.poli[k]===undefined)S.poli[k]=p[k];if(!Array.isArray(S.poli.items))S.poli.items=[]}
 if(!S.boss)S.boss={cleared:{},fights:0,bestDmg:0,cur:null};else{if(!S.boss.cleared)S.boss.cleared={};if(S.boss.fights===undefined)S.boss.fights=0;if(S.boss.bestDmg===undefined)S.boss.bestDmg=0}}}catch(e){S=null}
 if(!S)S=defState();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ 反馈特效 ============ */
function fly(txt,color){
 const el=document.createElement('div');el.className='flytxt';el.textContent=txt;
 el.style.color=color||'#e5c07b';el.style.top=(window.innerHeight*0.42+ri(-30,30))+'px';
 $('fly').appendChild(el);setTimeout(()=>el.remove(),1500);
}
function toast(msg,ms){
 const el=document.createElement('div');el.className='toast';el.innerHTML=msg;
 $('toast').appendChild(el);setTimeout(()=>{el.style.transition='.3s';el.style.opacity=0;setTimeout(()=>el.remove(),320)},ms||2400);
}
function confetti(n){
 const w=document.createElement('div');w.className='fx';document.body.appendChild(w);
 const cs=['#e5c07b','#d0534a','#5cb89a','#6aa9e0','#a98bd8'];
 for(let i=0;i<(n||40);i++){
  const d=document.createElement('div');d.className='conf';
  d.style.left=rnd(0,100)+'%';d.style.top=rnd(-20,10)+'%';
  d.style.background=pick(cs);d.style.animationDuration=rnd(1.6,3)+'s';d.style.animationDelay=rnd(0,.6)+'s';
  d.style.width=d.style.height=rnd(5,10)+'px';
  w.appendChild(d);
 }
 setTimeout(()=>w.remove(),4000);
}
function sheet(html){
 $('overlay').innerHTML='<div class="mask" data-a="close"></div><div class="sheet"><button class="sh-close" data-a="close">✕</button>'+html+'</div>';
 $('overlay').classList.add('show');
}
function closeSheet(){$('overlay').classList.remove('show');$('overlay').innerHTML='';}

/* ============ 成长计算 ============ */
function expMul(){
 let m=1;
 if(S.buff.wchangUntil>Date.now())m+=0.25;
 if(S.debuff&&S.debuff.date===today())m-=(1-(S.debuff.mul||0.75));
 return Math.max(0.4,m);
}
function addXp(n){
 S.xp+=n;let up=0;
 while(S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;up++}
 if(up){
  confetti(60);buzz([30,60,30]);
  const lv=S.lv;
  const show=()=>{
   if($('overlay').classList.contains('show')){setTimeout(show,800);return}
   sheet('<div class="center reveal"><div style="font-size:60px">🎊</div><h2 class="serif gold" style="font-size:22px;margin:6px 0">境界突破</h2><div class="sub">连破 '+up+' 阶，晋身</div><div class="serif gold" style="font-size:34px;font-weight:800;margin:6px 0">'+rankOf(lv)+'</div><div class="sub">第 '+lv+' 级 · 同榜道友皆为你侧目</div><button class="btn btn-primary btn-block mt16" data-a="close">继续修行</button></div>');
  };
  setTimeout(show,700);
 }
 return up;
}
function addAttr(k,n){S.attr[k]=Math.round((S.attr[k]+n)*10)/10}
function note(txt){S.log.unshift({t:Date.now(),x:txt});S.log=S.log.slice(0,40)}

/* ============ 日切 ============ */
function rollDay(){
 const t=today();
 if(S.lastDay!==t){
  if(S.lastDay){
   const gap=dayGap(S.lastDay,t);
   if(S.streakDate){
    const g2=dayGap(S.streakDate,t);
    if(g2>1){
     if(S.bag.filter(x=>x==='c3').length>0){
      S.bag.splice(S.bag.indexOf('c3'),1);
      toast('🛡️ <b>护心符碎裂</b>，连续 '+S.streak+' 天得以保全');
      note('护心符碎裂，连续天数保全');
     }else{S.streak=0;note('连续中断，重新起势')}
     S.streakDate=null;
    }
   }
   if(S.oath.signed){
    const y=S.history[S.lastDay];
    const ok=y&&y.min>=S.oath.min;
    if(ok){S.oath.streak++;S.bestOath=Math.max(S.bestOath,S.oath.streak)}
    else{S.oath.streak=0;S.debuff={date:t,mul:0.75};note('军令状未达，道心浮动')}
   }
   if(gap>7)S.debuff={date:t,mul:0.75};
   if(S.poli.last){
    const pg=dayGap(S.poli.last,t);
    if(pg>1){S.poli.streak=0;note('时政速记断签，重新累计')}
    else if(pg===1&&S.poli.streak>0){/* 正常延续 */}
   }
  }
  S.lastDay=t;S.today=freshToday();S.quests=genQuests(t);S.main=S.main||{};
  save();
 }
 if(!S.quests||!S.quests.length)S.quests=genQuests(t);
}
function genQuests(t){
 const pool=DAILY_POOL.slice();const out=[];
 for(let i=0;i<4&&pool.length;i++){
  const sd=seed(t+'q'+i+'|'+pool.length);
  const idx=Math.min(pool.length-1,Math.floor(sd*pool.length));
  const q=pool.splice(idx,1)[0];
  out.push({n:q.n,u:q.u,t:q.t,xp:q.xp,coin:q.coin,done:false});
 }
 return out;
}

/* ============ 行为：闭关 ============ */
function startFocus(sub,minutes){
 S.timer={sub:sub,total:minutes*60,endAt:Date.now()+minutes*60*1000,startAt:Date.now()};
 S.timer.evtAt=Date.now()+minutes*60*1000*rnd(0.3,0.75);
 S.timer.evtDone=false;
 save();render();startTicker();buzz(20);
 toast('⏳ 闭关开始，'+minutes+' 分钟后见');
}
function startTicker(){if(ticker)clearInterval(ticker);ticker=setInterval(tick,500)}
function tick(){
 if(!S||!S.timer)return;
 const left=Math.max(0,S.timer.endAt-Date.now());
 const el=$('tTime'),rg=$('tRing');
 if(el){el.textContent=mmss(Math.ceil(left/1000));
  const p=1-left/(S.timer.total*1000);
  if(rg)rg.setAttribute('stroke-dashoffset',(2*Math.PI*96)*(1-p));
  const st=$('tState');
  if(st){const mins=(Date.now()-S.timer.startAt)/60000;
   st.textContent=mins>=45?'心流之境 · 物我两忘':mins>=20?'渐入佳境':'凝神静气';}
 }
 if(!S.timer.evtDone&&Date.now()>=S.timer.evtAt){
  S.timer.evtDone=true;save();randomEvent();
 }
 if(left<=0)finishFocus();
}
function randomEvent(){
 const evs=[
  {i:'🍵',t:'窗外有人送来一盏清茶',g:'+15 修为',f:()=>{addXp(15)}},
  {i:'💡',t:'灵光一闪，某道题豁然开朗',g:'+30 修为',f:()=>{addXp(30);addAttr(S.timer.sub,5)}},
  {i:'📯',t:'同窗传来捷报，士气大振',g:'+25 铜钱',f:()=>{S.coin+=25}},
  {i:'🌀',t:'你进入了心流，效率暴涨',g:'本次闭关经验×1.3',f:()=>{S.timer.bonus=(S.timer.bonus||1)*1.3}},
  {i:'🧧',t:'案头发现一枚红包',g:'+40 铜钱',f:()=>{S.coin+=40}}
 ];
 const e=pick(evs);e.f();save();fly(e.g,'#f7e3b5');toast('<div style="display:flex;gap:9px;align-items:center"><span style="font-size:22px">'+e.i+'</span><div><b>机缘事件</b><br><span class="sub">'+e.t+' · '+e.g+'</span></div></div>',3000);
}
function finishFocus(){
 const T=S.timer;S.timer=null;if(ticker)clearInterval(ticker);
 const mins=T.total/60;
 let bonus=(T.bonus||1);
 let flowMul=mins>=45?1.2:1;
 if(S.today.min+mins>=60)flowMul=Math.max(flowMul,1.15);
 let danwu=false;
 if(S.buff.danwu>0){bonus*=2;S.buff.danwu--;danwu=true}
 const debuffed=!!(S.debuff&&S.debuff.date===today());
 let mul=expMul()*flowMul*bonus;
 const xp=Math.round(mins*6*mul),coin=Math.round(mins*2),attr=mins*1.1;
 addXp(xp);S.coin+=coin;addAttr(T.sub,attr);
 if(debuffed){S.debuff=null;note('闭关功成，道心复明')}
 S.total.min+=mins;S.total.focus++;
 S.today.min+=mins;
 S.key=Math.round((S.key+mins/28)*10)/10;
 if(mins>=90)S.flags.long90=true;
 const h=S.history[today()]||{min:0,q:0};h.min=Math.round((h.min+mins)*10)/10;S.history[today()]=h;
 if(S.today.min>=15&&S.streakDate!==today()){S.streak++;S.streakDate=today();S.bestStreak=Math.max(S.bestStreak,S.streak)}
 checkQuests();checkAch();save();
 buzz([40,80,40]);confetti(30);
 const tags=[];
 if(danwu)tags.push('<span class="pill" style="color:#a98bd8">顿悟丹 ×2</span>');
 if(flowMul>1)tags.push('<span class="pill" style="color:#5cb89a">心流加成 ×'+flowMul+'</span>');
 if(expMul()<1)tags.push('<span class="pill" style="color:#d0534a">懈怠 ×0.75</span>');
 if(debuffed)tags.push('<span class="pill" style="color:#5cb89a">道心复明</span>');
 sheet('<div class="center reveal"><div style="font-size:52px">🕯️</div><h2 class="serif gold">闭关功成</h2><div class="sub">'+SUBS.find(x=>x.k===T.sub).n+' · '+mins+' 分钟</div>'+
  '<div class="stat3" style="margin-top:14px"><div><div class="v gold">+'+xp+'</div><div class="k">修为</div></div><div><div class="v jade">+'+Math.round(attr)+'</div><div class="k">'+T.sub+'修为</div></div><div><div class="v blue">+'+coin+'</div><div class="k">铜钱</div></div></div>'+
  (tags.length?'<div class="row wrap gap6 center mt8" style="justify-content:center">'+tags.join('')+'</div>':'')+
  '<div class="card" style="margin-top:14px;text-align:left"><div class="serif" style="font-size:13.5px;color:var(--gold2);line-height:1.7">「'+pick(QUOTES)+'」</div></div>'+
  '<div class="sub mt12">累计闭关 '+Math.round(S.total.min)+' 分钟 · 连续 '+S.streak+' 天</div>'+
  '<button class="btn btn-primary btn-block mt16" data-a="close">收功</button></div>');
 render();
}

function bossHit(){
 const c=S.boss.cur;if(!c)return;
 const b=BOSSES.find(x=>x.id===c.id),m=BOSS_MODULES[c.round];
 const acc=Math.max(0,Math.min(100,parseInt($('bAcc').value)||0));
 const dmg=bossAtk(acc,m.w);
 c.dmg+=dmg;
 if(acc>=85)c.php=Math.min(100,c.php+6);
 else if(acc<45)c.php-=Math.round((45-acc)*1.4);
 if(acc>=85)c.logs.push('💥 '+m.k+' 暴击 '+dmg+'（正确率 '+acc+'%，气势 +6）');
 else if(acc<45)c.logs.push('🩸 '+m.k+' 仅 '+dmg+'，被反击（正确率 '+acc+'%）');
 else c.logs.push('⚔️ '+m.k+' 造成 '+dmg+' 伤害（正确率 '+acc+'%）');
 c.round++;
 const dead=c.dmg>=b.hp,tired=c.php<=0,end=c.round>=6;
 save();buzz(acc>=85?[30,60,30]:20);
 if(dead||tired||end)bossFinish(dead?'win':(tired?'tired':'lose'));
 else{fly('-'+dmg,'#e5736a');render()}
}
function bossFlee(){
 const c=S.boss.cur;if(!c)return;
 S.boss.cur=null;S.boss.fights++;save();closeSheet();
 toast('鸣金收兵。撤退不是失败，但 BOSS 还在那里');render();
}
function bossFinish(res){
 const c=S.boss.cur,b=BOSSES.find(x=>x.id===c.id);
 S.boss.fights++;
 S.boss.bestDmg=Math.max(S.boss.bestDmg||0,c.dmg);
 let win=res==='win';
 let rwd='',extra='';
 if(win){
  S.boss.cleared[b.id]=(S.boss.cleared[b.id]||0)+1;
  let mul=1+(S.buff.wchangUntil>Date.now()?0.25:0);
  if(S.buff.danwu>0){mul*=2;S.buff.danwu--;extra+='顿悟丹 ×2 · '}
  const xp=Math.round(b.xp*mul),coin=b.coin;
  addXp(xp);S.coin+=coin;
  SUBS.forEach(s=>addAttr(s.k,6));
  rwd='修为 +'+xp+' · 铜钱 +'+coin+' · 全科修为 +6';
  if(Math.random()<b.card){const cd=pick(CARDS);S.bag.push(cd.id);extra+='掉落「'+cd.n+'」'}
  S.key=Math.round((S.key+2)*10)/10;
  confetti(80);buzz([50,100,50]);
 }else{
  const xp=Math.round(b.xp*0.2);addXp(xp);S.coin+=Math.round(b.coin*0.15);
  rwd='残兵之赏：修为 +'+xp;
  if(res==='tired')note('心态崩盘，败于'+b.n);
 }
 S.boss.cur=null;
 note((win?'力斩 ':'败于 ')+b.n+'，输出 '+c.dmg+'/'+b.hp);
 checkQuests();checkAch();save();
 const title=win?'⚔️ 斩 之':(res==='tired'?'💔 心态崩盘':'🛡️ 力有不逮');
 const sub=win?'总输出 '+c.dmg+' / '+b.hp+' · 剩余心态 '+Math.round(c.php):'输出 '+c.dmg+' / '+b.hp+'，还差 '+(b.hp-c.dmg);
 sheet('<div class="center reveal"><div style="font-size:60px">'+(win?b.i:'🌫️')+'</div><h2 class="serif" style="font-size:22px;margin:6px 0;color:'+(win?'var(--gold)':'var(--sub)')+'">'+title+'</h2>'+
  '<div class="sub">'+b.n+' · '+sub+'</div>'+
  '<div style="font-size:15px;font-weight:700;margin-top:12px" class="'+(win?'gold':'')+'">'+rwd+'</div>'+
  (extra?'<div class="sub mt8">'+extra+'</div>':'')+
  (win?'<div class="card mt16" style="text-align:left"><div class="serif gold" style="font-size:13px">战报</div>'+c.logs.map(l=>'<div class="sub mt8">'+l+'</div>').join('')+'</div>'
      :'<div class="card mt16" style="text-align:left"><div class="sub">'+pick(QUOTES)+'<br><br>差距即方向。把这次的正确率记下来，下次同一模块的目标就是 +5%。</div></div>')+
  '<button class="btn btn-primary btn-block mt16" data-a="close">'+(win?'收 功':'再 战')+'</button></div>');
 render();
}

function qProg(q){return q.u==='min'?S.today.min:q.u==='q'?S.today.q:q.u==='essay'?S.today.essay:q.u==='box'?S.today.box:q.u==='poli'?S.today.poli:0}

 });

function radar(size){
 const n=6,cx=size/2,cy=size/2,R=size/2-18;
 const max=Math.max(200,...SUBS.map(s=>S.attr[s.k]));
 let grid='';
 for(let g=1;g<=3;g++){const rr=R*g/3;let p='';
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p+=(cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a))+' '}
  grid+='<polygon points="'+p+'" fill="none" stroke="#242e3a" stroke-width="1"/>'}
 let pts='',lab='';
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const v=Math.max(0,S.attr[SUBS[i].k])/max;const rr=R*v;
  pts+=(cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a))+' ';
  const lx=cx+(R+13)*Math.cos(a),ly=cy+(R+13)*Math.sin(a);
  lab+='<text x="'+lx+'" y="'+ly+'" font-size="9" fill="#8d97a5" text-anchor="middle" dominant-baseline="middle">'+SUBS[i].k+'</text>'}
 return '<svg width="'+size+'" height="'+size+'">'+grid+'<polygon points="'+pts+'" fill="rgba(229,192,123,.22)" stroke="#e5c07b" stroke-width="1.6"/>'+lab+'</svg>';
}
function heatmap(){
 const weeks=12;let cells='';
 const d=new Date();d.setHours(0,0,0,0);
 const end=new Date(d);const start=new Date(d);start.setDate(start.getDate()-(weeks*7-1));
 start.setDate(start.getDate()-start.getDay());
 for(let w=0;w<weeks+1;w++){
  for(let dd=0;dd<7;dd++){
   const cur=new Date(start);cur.setDate(cur.getDate()+w*7+dd);
   if(cur>end){cells+='<i style="background:transparent"></i>';continue}
   const k=fmt(cur),v=S.history[k];const m=v?v.min:0;
   const lv=m===0?0:m<20?1:m<45?2:m<90?3:4;
   const cs=['#151b23','#2a3a33','#3f6b58','#5cb89a','#e5c07b'];
   cells+='<i style="background:'+cs[lv]+'" title="'+k+' '+m+'分钟"></i>';
  }
 }
 return '<div style="display:grid;grid-template-columns:repeat('+(weeks+1)+',1fr);gap:3px">'+cells+'</div>';
}

function b64encode(str){
 return btoa(unescape(encodeURIComponent(str)));
}
function b64decode(b){
 return decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
}
function exportData(){

function copyBk(){
 const ta=document.getElementById('bkOut');if(!ta)return;
 ta.removeAttribute('readonly');ta.select();ta.setSelectionRange(0,ta.value.length);
 let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 ta.setAttribute('readonly','readonly');
 if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>toast('✓ 已复制，去粘贴保存吧')).catch(()=>{});return}
 toast(ok?'✓ 已复制，去粘贴保存吧':'请长按选中后手动复制');

function dlBk(fname){
 const payload=b64encode(JSON.stringify(S));
 try{
  const blob=new Blob([payload],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=fname||'上岸修行录备份.txt';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},800);
  toast('✓ 已保存到「文件」App');
 }catch(e){toast('保存失败，请改用复制')}
}

  S.cfg.gk=$('cfgGk').value||S.cfg.gk;S.cfg.sk=$('cfgSk').value||S.cfg.sk;
  S.cfg.goal=Math.max(15,parseInt($('cfgGoal').value)||90);S.name=($('cfgName').value||'赶考人').slice(0,10);
  save();toast('✓ 设置已保存');render();return}
 if(a==='openMind'){openMind();return}
 if(a==='openRank'){openRank();return}
 if(a==='openInstall'){openInstall();return}
 if(a==='exportData'){exportData();return}
 if(a==='importData'){importData();return}
 if(a==='doImport'){doImport();return}
 if(a==='copyBk'){copyBk();return}
 if(a==='dlBk'){dlBk(v);return}
 if(a==='resetData'){
  sheet('<h2 class="serif red">确认重置？</h2><div class="sub mt8">等级、修为、六维修为、成就、连续天数将全部归零，且无法恢复。</div><div class="row gap8 mt16"><button class="btn btn-block" data-a="close">再想想</button><button class="btn btn-red btn-block" data-a="resetOk">确认重置</button></div>');return}
 if(a==='resetOk'){localStorage.removeItem(KEY);S=defState();save();closeSheet();go('home');toast('已重置，重新出发');return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.timer){tick();startTicker()}});
document.addEventListener('input',e=>{
 if(e.target&&e.target.id==='bAcc'&&S&&S.boss&&S.boss.cur){
  const m=BOSS_MODULES[S.boss.cur.round];const v=parseInt(e.target.value)||0;
  const p=$('bPrev');if(p)p.textContent=bossAtk(Math.max(0,Math.min(100,v)),m.w);
 }
});

/* ============ 启动 ============ */
function welcome(){
 sheet('<div class="center"><div style="font-size:54px">🏯</div><h2 class="serif gold" style="font-size:21px;margin:6px 0">上岸修行录</h2><div class="sub">一场属于你自己的科举修行</div>'+
 '<div class="card mt16" style="text-align:left"><div class="sub" style="line-height:2">'+
 '① <b>闭关</b>：选科目、定时长，途中不可退出（退出 = 修为清零）<br>'+
 '② <b>刷题</b>：记下题数与正确率，修为即时到账<br>'+
 '③ <b>宝箱</b>：闭关积攒机缘值，开出随机奖励<br>'+
 '④ <b>课业</b>：每日刷新，未完成会一直提醒你<br>'+
 '⑤ <b>军令状</b>：与自己立约，违约有代价</div></div>'+
 '<div class="card mt12" style="text-align:left;border-color:#3a2f22"><div class="serif gold" style="font-size:13px">给赶考人的一句话</div><div class="sub mt8">别追求完美的一天，只追求不断的一天。系统的每个机制都在帮「明天的你」少做一次决策。</div></div>'+
 '<button class="btn btn-primary btn-block mt16" data-a="close">开始修行</button></div>');
}
load();rollDay();

/* ---------- PWA：状态标记 + 快捷入口 ---------- */
try{
 if(IS_STANDALONE())document.documentElement.classList.add('pwa');
 const q=new URLSearchParams(location.search).get('go');
 if(q&&['home','focus','quest','boss','honor','me'].indexOf(q)>=0)page=q;
}catch(e){}

/* ---------- PWA：离线缓存 ---------- */
if('serviceWorker' in navigator && location.protocol!=='file:'){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(reg=>{
   SW_OK=true;if(page==='me')render();
   reg.addEventListener('updatefound',()=>{
    const nw=reg.installing;if(!nw)return;
    nw.addEventListener('statechange',()=>{
     if(nw.state==='installed'&&navigator.serviceWorker.controller){
      try{toast('✨ 已更新到新版本，下次打开生效')}catch(e){}
     }
    });
   });
  }).catch(()=>{
   SW_OK=false;if(page==='me')render();
  });
 });
}

/* ---------- PWA：首次引导添加到桌面 ---------- */
function maybeInstallHint(){
 if(IS_STANDALONE())return;
 setTimeout(()=>{openInstall()},900);
}
if(!S.flags.welcomed&&!IS_STANDALONE()){
 // 首次使用：欢迎 → 引导加桌面
}else if(!IS_STANDALONE()&&S.flags.installHinted!==true){
 S.flags.installHinted=true;save();maybeInstallHint();
}

if(S.timer){page='focus';setTimeout(()=>{if(S.timer&&S.timer.endAt<=Date.now())finishFocus()},300)}
render();
if(S.timer)startTicker();
if(!S.flags.welcomed){S.flags.welcomed=true;save();setTimeout(welcome,500)}
setInterval(()=>{if(S){rollDay();save()}},30000);
})();

</script>
